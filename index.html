<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vietlott Demo</title>
</head>
<body>
<h1>Chào Mộc Dương</h1>
<p>Web Vietlott đang hoạt động.</p>

<button onclick="quay()">Quay số</button>

<h2 id="kq">--</h2>

<script>
function quay(){
 let so=[];
 while(so.length<6){
   let n=Math.floor(Math.random()*55)+1;
   if(!so.includes(n)) so.push(n);
 }
 so.sort((a,b)=>a-b);
 document.getElementById("kq").innerHTML=so.join(" - ");
}
</script>

</body>
</html>
