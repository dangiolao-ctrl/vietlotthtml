<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietlott Pro Full</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:15px;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#fff7e6,#ffe9e9);
text-align:center;
}

.header{
background:#c62828;
color:#fff;
padding:15px;
border-radius:15px;
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

select{
width:100%;
padding:12px;
font-size:18px;
border-radius:10px;
border:2px solid #fbc02d;
}

button{
cursor:pointer;
}

.mainButton{
width:100%;
padding:15px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:12px;
background:#d32f2f;
color:#fff;
margin-top:10px;
}

.quickBox{
display:flex;
gap:10px;
margin-top:10px;
}

.quickBtn{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#fbc02d;
font-weight:bold;
}

.ball{
width:60px;
height:60px;
display:inline-flex;
justify-content:center;
align-items:center;
border-radius:50%;
margin:5px;
font-size:22px;
font-weight:bold;
background:radial-gradient(circle,#fff176,#fbc02d);
box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.number3d{
font-size:42px;
font-weight:bold;
color:#c62828;
margin:10px;
letter-spacing:5px;
}

.sectionTitle{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.historyItem{
text-align:left;
padding:8px;
border-bottom:1px solid #eee;
font-size:14px;
}

.starBox{
padding:10px;
background:#fff9c4;
border-radius:10px;
margin-top:10px;
font-size:14px;
}

.small{
font-size:13px;
color:#666;
}
</style>
</head>

<body>

<div class="header">🎰 Vietlott Pro FULL</div>

<div class="card">

<div class="sectionTitle">Chọn chế độ</div>

<select id="mode">
<option value="mega">Mega 6/45</option>
<option value="power">Power 6/55</option>
<option value="3d">3D Slot</option>
</select>

<button class="mainButton" onclick="quay()">🎲 QUAY NGAY</button>

<div class="quickBox">
<button class="quickBtn" onclick="auto(10)">10 lần</button>
<button class="quickBtn" onclick="auto(50)">50 lần</button>
</div>

<div class="small">💡 Có lưu lịch sử + yêu thích + thống kê</div>

</div>

<div class="card">
<div class="sectionTitle">🎯 Kết quả</div>
<div id="result">Chưa có kết quả</div>
</div>

<div class="card">
<div class="sectionTitle">⭐ Yêu thích</div>
<div id="fav">Chưa có</div>
</div>

<div class="card">
<div class="sectionTitle">📊 Thống kê</div>
<div id="stats">Chưa có dữ liệu</div>
</div>

<div class="card">
<div class="sectionTitle">📜 Lịch sử</div>
<div id="history">Chưa có lịch sử</div>
</div>

<script>

let hist=[];
let stats={};
let fav="";
let running=false;

/* âm thanh nhẹ */
function tick(){
  let ctx=new (window.AudioContext||webkitAudioContext)();
  let o=ctx.createOscillator();
  let g=ctx.createGain();
  o.type="square";
  o.frequency.value=900;
  g.gain.value=0.03;
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime+0.04);
}

/* random */
function randUnique(c,max){
  let a=[];
  while(a.length<c){
    let n=Math.floor(Math.random()*max)+1;
    if(!a.includes(n)) a.push(n);
  }
  return a.sort((x,y)=>x-y);
}

/* slot */
function spin(el,final,max,delay,digits){
  let i=0;
  let t=setInterval(()=>{
    el.innerText=(Math.floor(Math.random()*max)+1)
      .toString().padStart(digits,"0");

    tick();
    i++;

    if(i>18){
      clearInterval(t);
      el.innerText=final.toString().padStart(digits,"0");
    }
  },delay);
}

/* update */
function updateHistory(t){
  hist.unshift(t);
  if(hist.length>30) hist.pop();
  document.getElementById("history").innerHTML=
  hist.map(i=>`<div class="historyItem">${i}</div>`).join("");
}

function updateStats(nums){
  nums.forEach(n=>{
    stats[n]=(stats[n]||0)+1;
  });

  let top="-",max=0;
  for(let k in stats){
    if(stats[k]>max){
      max=stats[k];
      top=k;
    }
  }

  document.getElementById("stats").innerHTML=
  `🔥 Hot number: <b>${top}</b> (${max} lần)`;
}

/* main */
function quay(){

  if(running) return;
  running=true;

  let m=document.getElementById("mode").value;
  let r=document.getElementById("result");
  r.innerHTML="";

  /* MEGA */
  if(m==="mega"){
    let n=randUnique(6,45);
    r.innerHTML="🎰 Mega 6/45";

    n.forEach(x=>{
      let d=document.createElement("div");
      d.className="ball";
      d.innerText="00";
      r.appendChild(d);
      setTimeout(()=>spin(d,x,45,120,2),Math.random()*300);
    });

    setTimeout(()=>{
      updateHistory("Mega: "+n.join("-"));
      updateStats(n);
      fav=n.join(" - ");
      document.getElementById("fav").innerText=fav;
      running=false;
    },2200);
  }

  /* POWER */
  else if(m==="power"){
    let n=randUnique(6,55);
    r.innerHTML="⚡ Power 6/55";

    n.forEach(x=>{
      let d=document.createElement("div");
      d.className="ball";
      d.innerText="00";
      r.appendChild(d);
      setTimeout(()=>spin(d,x,55,120,2),Math.random()*300);
    });

    setTimeout(()=>{
      updateHistory("Power: "+n.join("-"));
      updateStats(n);
      fav=n.join(" - ");
      document.getElementById("fav").innerText=fav;
      running=false;
    },2300);
  }

  /* 3D */
  else{
    let a=Math.floor(Math.random()*1000).toString().padStart(3,"0");
    let b=Math.floor(Math.random()*1000).toString().padStart(3,"0");

    r.innerHTML=`
      <div class="number3d" id="a">000</div>
      <div class="number3d" id="b">000</div>
    `;

    spin(aEl=document.getElementById("a"),a,1000,140,3);

    setTimeout(()=>{
      spin(bEl=document.getElementById("b"),b,1000,160,3);
    },600);

    setTimeout(()=>{
      updateHistory("3D: "+a+" | "+b);
      fav=a+" | "+b;
      document.getElementById("fav").innerText=fav;
      running=false;
    },2500);
  }
}

/* auto demo */
function auto(n){
  alert("Chế độ demo "+n+" lần (giữ nhẹ máy)");
}

</script>

</body>
</html>
